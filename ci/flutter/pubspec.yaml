name: king_vpn
description: King VPN Android build manifest
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  webview_flutter: ^4.14.1
  flutter_v2ray_client: 3.5.0
  installed_apps: 1.6.0
  permission_handler: ^13.0.2
  workmanager: ^0.10.10
  url_launcher: ^6.3.3
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  local_inference: 0.1.1
  local_inference_flutter: 0.1.1
  path_provider: ^2.1.6
  package_info_plus: ^9.0.1
  speech_to_text: ^7.4.0
  cryptography: ^2.7.0
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
