      - name: Build libbox.aar (sing-box core)
        env:
          GOTOOLCHAIN: local
        run: |
          echo "Cloning sing-box v1.14.4..."
          git clone --depth 1 --branch v1.14.4 https://github.com/SagerNet/sing-box.git sing-box-src
          cd sing-box-src

          echo "Go version in use:"
          go version
          echo "sing-box go.mod requires:"
          grep '^go ' go.mod || true

          echo "Pinning gomobile to the version sing-box go.mod uses..."
          go get golang.org/x/mobile/bind
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          export PATH=$PATH:$(go env GOPATH)/bin

          echo "Initializing gomobile..."
          gomobile init

          echo "Building libbox.aar for arm64 and arm..."
          gomobile bind -target=android/arm64,android/arm -androidapi 24 \
            -ldflags=-checklinkname=0 \
            -o ../libbox.aar ./experimental/libbox
          cd ..

          echo "Verifying libbox.aar..."
          ls -la libbox.aar
          size=$(stat -c%s libbox.aar)
          [ "$size" -gt 1000000 ] || { echo "ERROR: libbox.aar too small ($size bytes)"; exit 1; }
          echo "OK: libbox.aar built successfully ($size bytes)"
