name: Build APK
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create project
        run: |
          flutter create --project-name king_vpn --org com.kingvpn --platforms=android build_app
          rm -rf build_app/test
          for f in main iran_ai_extras npv_am_extras tg_proxy nat_ultra net_diag extras_plus donate ads_remote king_heal update_check online server_shop telegram_channels vpn_sources help_page conn_specs ultimate_extras auto_test; do
            [ -f "lib/$f.dart" ] || { echo "ERROR: lib/$f.dart missing"; exit 1; }
            cp "lib/$f.dart" "build_app/lib/$f.dart"
          done
          python3 prepare_android.py

      - name: Add packages
        working-directory: build_app
        run: |
          flutter pub add http flutter_v2ray_client openvpn_flutter wireguard_flutter shared_preferences installed_apps:1.6.0 permission_handler workmanager url_launcher webview_flutter
          flutter pub get

      - name: Fix plugin compileSdk (wireguard_flutter etc require API 33+)
        run: |
          # Raise compileSdk in outdated plugins so AGP accepts modern AndroidX deps
          find "$HOME/.pub-cache" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
            \( -path '*/wireguard_flutter*/android/*' -o -path '*/openvpn_flutter*/android/*' -o -path '*/flutter_v2ray_client*/android/*' \) \
            2>/dev/null | while read -r f; do
            echo "Patching $f"
            sed -i -E \
              -e 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 35/' \
              -e 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 35/' \
              "$f" || true
          done
          # Also force all subprojects (plugins) via root build script if present
          for rootg in build_app/android/build.gradle build_app/android/build.gradle.kts; do
            if [ -f "$rootg" ]; then
              if ! grep -q 'FORCE_COMPILE_SDK' "$rootg"; then
                if [[ "$rootg" == *.kts ]]; then
                  cat >> "$rootg" << 'EOF'

// FORCE_COMPILE_SDK: make every Android subproject (plugins) use a modern compileSdk
subprojects {
    afterEvaluate {
        extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.apply {
            compileSdkVersion(35)
        }
    }
}
EOF
                else
                  cat >> "$rootg" << 'EOF'

// FORCE_COMPILE_SDK: make every Android subproject (plugins) use a modern compileSdk
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 35
            }
        }
    }
}
EOF
                fi
                echo "Patched $rootg"
              fi
            fi
          done

      - name: Analyze (errors only, fails early with a readable message)
        working-directory: build_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        # analysis_options.yaml (written by prepare_android.py) ignores
        # library_private_types_in_public_api and similar part-of noise

      - name: Decode signing key
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          [ -n "$KS_BASE64" ] || { echo "ERROR: secret KS_BASE64 is missing"; exit 1; }
          echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: build_app
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          printf '\norg.gradle.vfs.watch=false\norg.gradle.daemon=false\norg.gradle.jvmargs=-Xmx3g\n' >> android/gradle.properties
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Publish APK as Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: King VPN build ${{ github.run_number }}
          files: |
            build_app/build/app/outputs/flutter-apk/*.apk
            build_app/pubspec.lock
