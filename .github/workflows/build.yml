name: King VPN Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source-repair guard
        run: |
          set -o pipefail
          python3 -m unittest discover -s test -p 'test_*.py' 2>&1 | tee source-guard.log
          python3 -m py_compile tools/king_ai_training/*.py 2>&1 | tee -a source-guard.log

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Generate Android Flutter host and copy project sources
        run: |
          flutter create --project-name king_vpn --org com.kingvpn --platforms=android build_app
          test -f lib/main.dart || { echo 'lib/main.dart is missing'; exit 1; }
          mkdir -p build_app/android/app/libs build_app/test
          rm -f build_app/test/widget_test.dart
          cp -R lib/. build_app/lib/
          cp -R test/. build_app/test/
          grep -q 'bool requireRewardedAd = true;' build_app/lib/main.dart || { echo 'Required source guard missing'; exit 1; }
          python3 prepare_android.py
          python3 tools/configure_local_ai_host.py build_app/pubspec.yaml

      - name: Resolve Flutter dependencies
        working-directory: build_app
        run: |
          flutter pub add http webview_flutter flutter_v2ray_client:3.5.0 installed_apps:1.6.0 permission_handler workmanager url_launcher crypto:^3.0.3 flutter_secure_storage:^9.2.2 local_inference:0.1.1 local_inference_flutter:0.1.1 path_provider package_info_plus speech_to_text:^7.4.0 cryptography:^2.7.0 flutter_tts:^4.2.3
          flutter pub get

      - name: Patch V2Ray plugin
        working-directory: build_app
        run: python3 ../patch_plugin.py

      - name: Run focused national scanner tests
        id: scanner_tests
        continue-on-error: true
        working-directory: build_app
        run: |
          set -o pipefail
          flutter test test/king_national_scanner_test.dart 2>&1 | tee scanner-test.log

      - name: Run durable scanner journal tests
        id: scanner_memory_tests
        continue-on-error: true
        working-directory: build_app
        run: |
          set -o pipefail
          flutter test test/king_scan_memory_test.dart 2>&1 | tee scanner-memory-test.log

      - name: Run Net Melli IPv4/IPv6 endpoint tests
        id: net_melli_ip_tests
        continue-on-error: true
        working-directory: build_app
        run: |
          set -o pipefail
          flutter test test/nat_ip_scan_test.dart test/nat_ipv6_seed_test.dart 2>&1 | tee net-melli-ip-test.log

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        working-directory: build_app
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Normalize plugin compile SDK
        shell: bash
        run: |
          find "$HOME/.pub-cache" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -path "*/flutter_v2ray*" -print0 | while IFS= read -r -d '' file; do
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 35/g' "$file" || true
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 35/g' "$file" || true
          done

      - name: Analyze Dart sources
        working-directory: build_app
        run: |
          set -o pipefail
          flutter analyze lib test/king_national_scanner_test.dart test/king_scan_memory_test.dart test/nat_ip_scan_test.dart test/nat_ipv6_seed_test.dart --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log

      - name: Build optimized Android release-mode APK (arm64)
        working-directory: build_app
        env:
          CGO_LDFLAGS: "-Wl,-z,max-page-size=16384"
          LINT_PRINT_STACKTRACE: "true"
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "APK build attempt ${attempt}/3"
            attempt_log="build-attempt-${attempt}.log"
            if flutter build apk --release --obfuscate --split-debug-info=build/symbols --target-platform android-arm64 --split-per-abi 2>&1 | tee "$attempt_log" | tee -a build.log; then
              exit 0
            fi
            if grep -Eq 'Error on ZipFile unknown archive|NDK.*(corrupt|not found)' "$attempt_log"; then
              echo "Transient Android NDK archive failure; removing the incomplete NDK download before retry."
              SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
              rm -rf "$SDK_ROOT/ndk/28.2.13676358" "$SDK_ROOT/.temp"
            elif ! grep -Eq 'Could not (find|resolve) org[.]jetbrains[.]kotlin:|Received status code (429|5[0-9][0-9])' "$attempt_log"; then
              echo "APK build failed for a non-transient reason; stopping retries."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Transient dependency/toolchain resolution failure; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "APK build still blocked after three transient-resolution attempts."
          exit 1

      - name: Report optimized APK size
        if: success()
        run: |
          set -euo pipefail
          APK="build_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          BYTES="$(stat -c '%s' "$APK")"
          MIB="$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "### King VPN optimized APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Variant: Android release mode, split arm64-v8a APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: ${MIB} MiB (${BYTES} bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: ${SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: generated Flutter debug key; not a production-signed release" >> "$GITHUB_STEP_SUMMARY"
          printf 'APK_SIZE_BYTES=%s\nAPK_SIZE_MIB=%s\nAPK_SHA256=%s\n' "$BYTES" "$MIB" "$SHA" > apk-size-report.txt

      - name: Upload Dart obfuscation symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: king-vpn-symbols-${{ github.run_number }}
          path: build_app/build/symbols/
          if-no-files-found: error
          retention-days: 30

      - name: Package complete source and generated Flutter project
        if: success()
        run: |
          zip -qr "$RUNNER_TEMP/king-vpn-full-source-${GITHUB_RUN_NUMBER}.zip" . \
            -x '.git/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' \
               '.dart_tool/*' 'build/*' 'build_app/.dart_tool/*' \
               'build_app/build/*' 'build_app/android/.gradle/*' \
               'build_app/android/app/build/*' 'build_app/android/build/*' \
               'build_app/android/local.properties' 'build_app/.flutter-plugins*'

      - name: Upload complete project ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: king-vpn-full-source-${{ github.run_number }}
          path: ${{ runner.temp }}/king-vpn-full-source-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build diagnostics for source repair
        if: failure()
        run: |
          set +e
          python3 tools/diagnose_build.py source-guard.log build_app/test.log build_app/analyze.log build_app/build.log --output repair-diagnostics.json
          mkdir -p repair-evidence/lint
          if [ -f build_app/build.log ]; then tail -n 350 build_app/build.log > repair-evidence/gradle-build-tail.txt; fi
          if [ -f build_app/analyze.log ]; then tail -n 120 build_app/analyze.log > repair-evidence/dart-analyze-tail.txt; fi
          find build_app/build_app build_app/android build_app/build -type f \( -iname '*lint*' -o -path '*/reports/*' \) -size -5M -print 2>/dev/null | head -n 80 | while IFS= read -r report; do
            safe_name="$(printf '%s' "$report" | tr '/ ' '__')"
            cp "$report" "repair-evidence/lint/$safe_name" 2>/dev/null || true
          done
          printf 'Run: %s\nCommit: %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > repair-evidence/run.txt
          exit 0

      - name: Upload repair diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: king-vpn-repair-diagnostics-${{ github.run_number }}
          path: |
            repair-diagnostics.json
            repair-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: king-vpn-arm64-release-${{ github.run_number }}
          path: build_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      # Preserve analyzer/build evidence after a failing test suite without
      # reporting an overall successful CI run.
      - name: Enforce test gates
        if: always()
        run: |
          scanner_result="${{ steps.scanner_tests.outcome }}"
          memory_result="${{ steps.scanner_memory_tests.outcome }}"
          net_melli_ip_result="${{ steps.net_melli_ip_tests.outcome }}"
          unit_result="${{ steps.unit_tests.outcome }}"
          if [ "$scanner_result" != "success" ] || [ "$memory_result" != "success" ] || [ "$net_melli_ip_result" != "success" ] || [ "$unit_result" != "success" ]; then
            echo "Scanner tests: $scanner_result; scanner memory tests: $memory_result; Net Melli IP tests: $net_melli_ip_result; full unit tests: $unit_result"
            exit 1
          fi
