name: Build APK
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Go modules and gomobile
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build libbox.aar (sing-box core)
        run: |
          echo "Cloning sing-box v1.14.4..."
          git clone --depth 1 --branch v1.14.4 https://github.com/SagerNet/sing-box.git sing-box-src
          cd sing-box-src
          
          echo "Installing gomobile..."
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          
          echo "Adding gomobile dependency to sing-box module..."
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          
          echo "Initializing gomobile (this downloads NDK if missing, may take a few minutes)..."
          gomobile init
          
          echo "Building libbox.aar for arm64 and arm..."
          gomobile bind -target=android/arm64,android/arm -androidapi 24 -o ../libbox.aar ./experimental/libbox
          cd ..
          
          echo "Verifying libbox.aar..."
          ls -la libbox.aar
          size=$(stat -c%s libbox.aar)
          [ "$size" -gt 1000000 ] || { echo "ERROR: libbox.aar too small ($size bytes)"; exit 1; }
          echo "OK: libbox.aar built successfully ($size bytes)"

      - name: Create project
        run: |
          flutter create --project-name king_vpn --org com.kingvpn --platforms=android build_app
          rm -rf build_app/test
          [ -f lib/main.dart ] || { echo "ERROR: lib/main.dart missing"; exit 1; }
          cp -r lib/. build_app/lib/
          grep -q 'bool requireRewardedAd = true;' build_app/lib/main.dart \
            || { echo "ERROR: requireRewardedAd is not true"; exit 1; }
          python3 prepare_android.py

      - name: Add packages
        working-directory: build_app
        run: |
          flutter pub add http flutter_v2ray_client:3.5.0 installed_apps:1.6.0 permission_handler workmanager url_launcher webview_flutter
          flutter pub get

      - name: Patch flutter_v2ray_client VPN race (VPNRACE)
        working-directory: build_app
        run: python3 ../patch_plugin.py

      - name: Fix compileSdk of plugins
        run: |
          echo "=== Fixing low compileSdk in plugins ==="
          find "$HOME/.pub-cache" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            \( -path "*/flutter_v2ray*" \) \
            2>/dev/null | while read -r file; do
              echo "Patching: $file"
              sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 35/g' "$file" || true
              sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 35/g' "$file" || true
            done
          echo "=== Done ==="

      - name: Analyze (errors only, fails early with a readable message)
        working-directory: build_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: Decode signing key
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          [ -n "$KS_BASE64" ] || { echo "ERROR: secret KS_BASE64 is missing"; exit 1; }
          echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: build_app
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          printf '\norg.gradle.vfs.watch=false\norg.gradle.daemon=false\norg.gradle.jvmargs=-Xmx3g\n' >> android/gradle.properties
          for attempt in 1 2 3; do
            if flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}; then
              exit 0
            fi
            echo "Build attempt $attempt failed; waiting before retry..."
            sleep $((attempt * 90))
          done
          echo "Build failed after 3 attempts"
          exit 1

      - name: Keep APK as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: king-vpn-apk-${{ github.run_number }}
          path: build_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Publish APK as Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: King VPN build ${{ github.run_number }}
          files: |
            build_app/build/app/outputs/flutter-apk/*.apk
            build_app/pubspec.lock
