name: King VPN Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source-repair guard
        run: |
          set -o pipefail
          python3 -m unittest discover -s test -p 'test_*.py' 2>&1 | tee source-guard.log
          python3 -m py_compile tools/king_ai_training/*.py 2>&1 | tee -a source-guard.log

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Generate Android Flutter host and copy project sources
        run: |
          flutter create --project-name king_vpn --org com.kingvpn --platforms=android build_app
          test -f lib/main.dart || { echo 'lib/main.dart is missing'; exit 1; }
          mkdir -p build_app/android/app/libs build_app/test
          rm -f build_app/test/widget_test.dart
          cp -R lib/. build_app/lib/
          cp -R test/. build_app/test/
          grep -q 'bool requireRewardedAd = true;' build_app/lib/main.dart || { echo 'Required source guard missing'; exit 1; }
          python3 prepare_android.py
          python3 tools/configure_local_ai_host.py build_app/pubspec.yaml

      - name: Resolve Flutter dependencies
        working-directory: build_app
        run: |
          flutter pub add http flutter_v2ray_client:3.5.0 installed_apps:1.6.0 permission_handler workmanager url_launcher webview_flutter crypto:^3.0.3 flutter_secure_storage:^9.2.2 local_inference:0.1.1 local_inference_flutter:0.1.1 path_provider package_info_plus speech_to_text:^7.4.0 cryptography:^2.7.0 flutter_tts:^4.2.3
          flutter pub get

      - name: Patch V2Ray plugin
        working-directory: build_app
        run: python3 ../patch_plugin.py

      - name: Run unit tests
        working-directory: build_app
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Normalize plugin compile SDK
        shell: bash
        run: |
          find "$HOME/.pub-cache" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -path "*/flutter_v2ray*" -print0 | while IFS= read -r -d '' file; do
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 35/g' "$file" || true
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 35/g' "$file" || true
          done

      - name: Analyze Dart sources
        working-directory: build_app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log

      - name: Build debug APK (unsigned)
        working-directory: build_app
        env:
          CGO_LDFLAGS: "-Wl,-z,max-page-size=16384"
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "APK build attempt ${attempt}/3"
            if flutter build apk --debug --target-platform android-arm64 2>&1 | tee -a build.log; then
              exit 0
            fi
            if ! grep -Eq 'Could not (find|resolve) org[.]jetbrains[.]kotlin:|Received status code (429|5[0-9][0-9])' build.log; then
              echo "APK build failed for a non-transient reason; stopping retries."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Transient Maven/Kotlin resolution failure; retrying in ${delay}s without forcing dependency refresh."
              sleep "$delay"
            fi
          done
          echo "APK build still blocked after three transient-resolution attempts."
          exit 1

      - name: Package complete source and generated Flutter project
        if: success()
        run: |
          zip -qr "$RUNNER_TEMP/king-vpn-full-source-${GITHUB_RUN_NUMBER}.zip" . \
            -x '.git/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' \
               '.dart_tool/*' 'build/*' 'build_app/.dart_tool/*' \
               'build_app/build/*' 'build_app/android/.gradle/*' \
               'build_app/android/app/build/*' 'build_app/android/build/*' \
               'build_app/android/local.properties' 'build_app/.flutter-plugins*'

      - name: Upload complete project ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: king-vpn-full-source-${{ github.run_number }}
          path: ${{ runner.temp }}/king-vpn-full-source-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build diagnostics for source repair
        if: failure()
        run: |
          python3 tools/diagnose_build.py source-guard.log build_app/test.log build_app/analyze.log build_app/build.log --output repair-diagnostics.json || true

      - name: Upload repair diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: king-vpn-repair-diagnostics-${{ github.run_number }}
          path: repair-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: king-vpn-debug-${{ github.run_number }}
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
