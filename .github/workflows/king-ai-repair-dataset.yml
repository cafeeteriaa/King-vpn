name: King AI Verified Repair Dataset

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: king-ai-repair-dataset
  cancel-in-progress: false

jobs:
  collect-merged-repair:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'king-ai/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect only merged, green, allowlisted repairs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/king_ai_training/collect_merged_repairs.py
      - name: Commit new verified training example
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KING_AI_BASE_MODEL_PATH: ${{ vars.KING_AI_BASE_MODEL_PATH }}
        run: |
          if [ ! -f data/king_ai_accepted_repairs.jsonl ] || [ -z "$(git status --porcelain -- data/king_ai_accepted_repairs.jsonl)" ]; then
            echo "No new eligible training example; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/king_ai_accepted_repairs.jsonl
          git commit -m "King AI: add verified merged repair training example"
          if git push origin HEAD:main; then
            count="$(awk 'NF { n++ } END { print n+0 }' data/king_ai_accepted_repairs.jsonl)"
            if [ "$count" -ge 5 ] && [ -n "$KING_AI_BASE_MODEL_PATH" ]; then
              GH_TOKEN="$GITHUB_TOKEN" gh workflow run king-ai-local-training.yml \
                --ref main \
                -f base_model_path="$KING_AI_BASE_MODEL_PATH" \
                -f dataset_path=data/king_ai_accepted_repairs.jsonl \
                -f max_steps=500
            else
              echo "Training not dispatched: need five accepted examples and KING_AI_BASE_MODEL_PATH."
            fi
          else
            echo "Direct main update is unavailable; opening a dataset-only PR."
            branch="king-ai/dataset-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/$branch"
            GH_TOKEN="$GITHUB_TOKEN" gh pr create \
              --base main --head "$branch" \
              --title "King AI: add verified repair training data" \
              --body "Automated, secret-scanned examples from merged, CI-green, allowlisted repair PRs. This PR contains training data only; it does not modify app code or deploy model weights."
          fi
